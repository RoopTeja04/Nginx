events {
    worker_connections 1024;
}

http {
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    server {
        listen 80;

        # ========================
        # CORS
        # ========================

        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

        # ========================
        # PREFLIGHT
        # ========================

        if ($request_method = OPTIONS) {
            return 204;
        }

        # ========================
        # HEALTH
        # ========================

        location = /healthz {
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # ========================
        # AUTH SERVICE
        # ========================

        location /auth/ {
            proxy_pass https://system-design-app-auth-service-server-1.onrender.com;

            proxy_ssl_server_name on;
            proxy_ssl_name system-design-app-auth-service-server-1.onrender.com;

            proxy_set_header Host system-design-app-auth-service-server-1.onrender.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_redirect off;
        }

        location = /auth {
            return 301 /auth/;
        }

        # ========================
        # FEED SERVICE
        # ========================

        location /feed/ {
            proxy_pass https://system-design-app-feed-service-server-1.onrender.com;

            proxy_ssl_server_name on;
            proxy_ssl_name system-design-app-feed-service-server-1.onrender.com;

            proxy_set_header Host system-design-app-feed-service-server-1.onrender.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_redirect off;
        }

        location = /feed {
            return 301 /feed/;
        }

        # ========================
        # PROFILE SERVICE
        # ========================

        location /profile/ {
            proxy_pass https://system-design-app-profile-service-server.onrender.com;

            proxy_ssl_server_name on;
            proxy_ssl_name system-design-app-profile-service-server.onrender.com;

            proxy_set_header Host system-design-app-profile-service-server.onrender.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_redirect off;
        }

        location = /profile {
            return 301 /profile/;
        }

        # ========================
        # FALLBACK
        # ========================

        location / {
            return 404;
        }
    }
}
